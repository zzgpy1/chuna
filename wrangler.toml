name = "cashier-manager"
main = "worker/index.js"
compatibility_date = "2024-07-01"

[[d1_databases]]
binding = "DB"
database_name = "cashier-db"
database_id = "4d5e4631-3c68-45eb-b538-d312e05d5296"  # 创建 D1 后替换

[vars]
# 这些变量会在 GitHub Actions 中通过 secrets 注入，也可以在此设置默认值
# USERNAME = "admin"
# PASSWORD = "password"
# API_TOKEN = "your-secure-token"

[env.production]
vars = { USERNAME = "admin", PASSWORD = "password", API_TOKEN = "your-secure-token" }
