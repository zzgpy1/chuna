<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>出纳管理系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ===== 全局重置 & 基础 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        :root {
            --primary: #4F46E5;
            --primary-dark: #4338CA;
            --primary-light: #818CF8;
            --primary-bg: #EEF2FF;
            --success: #10B981;
            --success-bg: #D1FAE5;
            --warning: #F59E0B;
            --warning-bg: #FEF3C7;
            --danger: #EF4444;
            --danger-bg: #FEE2E2;
            --gray-50: #F9FAFB;
            --gray-100: #F3F4F6;
            --gray-200: #E5E7EB;
            --gray-300: #D1D5DB;
            --gray-400: #9CA3AF;
            --gray-500: #6B7280;
            --gray-600: #4B5563;
            --gray-700: #374151;
            --gray-800: #1F2937;
            --gray-900: #111827;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
            --radius: 12px;
            --radius-sm: 8px;
            --transition: all 0.2s ease;
        }
        body {
            background: var(--gray-100);
            color: var(--gray-800);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        /* ===== 登录页面 ===== */
        .login-container {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            padding: 40px 32px;
            animation: fadeUp 0.5s ease;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-header { text-align: center; margin-bottom: 32px; }
        .login-header .logo-icon {
            width: 56px;
            height: 56px;
            background: var(--primary);
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 12px;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }
        .login-header h1 { font-size: 24px; font-weight: 700; color: var(--gray-900); letter-spacing: -0.5px; }
        .login-header p { color: var(--gray-500); font-size: 14px; margin-top: 4px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; font-weight: 500; color: var(--gray-700); margin-bottom: 6px; }
        .form-group .input-wrapper { position: relative; }
        .form-group .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-400);
            font-size: 16px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px 12px 44px;
            border: 1.5px solid var(--gray-200);
            border-radius: var(--radius-sm);
            font-size: 15px;
            transition: var(--transition);
            background: var(--gray-50);
            outline: none;
        }
        .form-group input:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
        }
        .btn-primary { background: var(--primary); color: #fff; width: 100%; }
        .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: var(--shadow-md); }
        .btn-primary:active { transform: translateY(0); }
        .btn-success { background: var(--success); color: #fff; }
        .btn-success:hover { background: #059669; }
        .btn-warning { background: var(--warning); color: #fff; }
        .btn-warning:hover { background: #D97706; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-danger:hover { background: #DC2626; }
        .btn-outline { background: transparent; color: var(--gray-600); border: 1.5px solid var(--gray-300); }
        .btn-outline:hover { background: var(--gray-100); border-color: var(--gray-400); }
        .btn-sm { padding: 6px 14px; font-size: 13px; }
        .btn-xs { padding: 4px 10px; font-size: 12px; }
        .login-error {
            background: var(--danger-bg);
            color: var(--danger);
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            display: none;
            margin-bottom: 16px;
        }
        .login-error.show { display: block; }
        /* ===== 主应用布局 ===== */
        .app-container {
            width: 100%;
            max-width: 1440px;
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            display: none;
            min-height: 90vh;
            animation: fadeUp 0.4s ease;
        }
        .app-container.active { display: flex; flex-direction: column; }
        /* ===== 顶部导航 ===== */
        .app-header {
            background: #fff;
            border-bottom: 1px solid var(--gray-200);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .app-header .brand { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; color: var(--gray-900); }
        .app-header .brand i { color: var(--primary); font-size: 22px; }
        .app-header .header-actions { display: flex; align-items: center; gap: 12px; }
        .app-header .header-actions .user-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--primary-bg);
            padding: 6px 14px 6px 10px;
            border-radius: 30px;
            font-size: 14px;
            color: var(--primary);
            font-weight: 500;
        }
        .app-header .header-actions .user-badge i { font-size: 16px; }
        .btn-logout {
            background: transparent;
            border: none;
            color: var(--gray-500);
            cursor: pointer;
            font-size: 18px;
            padding: 6px;
            border-radius: 50%;
            transition: var(--transition);
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-logout:hover { background: var(--gray-100); color: var(--danger); }
        /* ===== 统计卡片 ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            padding: 16px 24px 0 24px;
        }
        .stat-card {
            background: var(--gray-50);
            border-radius: var(--radius-sm);
            padding: 16px 18px;
            border: 1px solid var(--gray-200);
            transition: var(--transition);
        }
        .stat-card:hover { border-color: var(--primary-light); background: #fff; }
        .stat-card .stat-label { font-size: 13px; color: var(--gray-500); font-weight: 500; display: flex; align-items: center; gap: 6px; }
        .stat-card .stat-value { font-size: 26px; font-weight: 700; color: var(--gray-900); margin-top: 4px; }
        .stat-card .stat-value .currency { font-size: 16px; font-weight: 400; color: var(--gray-500); }
        /* ===== Tab 导航 ===== */
        .tab-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            padding: 12px 24px 0 24px;
            border-bottom: 1px solid var(--gray-200);
            background: var(--gray-50);
        }
        .tab-nav .tab-btn {
            padding: 10px 20px;
            border: none;
            background: transparent;
            font-size: 14px;
            font-weight: 500;
            color: var(--gray-500);
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: var(--transition);
            border-radius: var(--radius-sm) var(--radius-sm) 0 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .tab-nav .tab-btn:hover { color: var(--gray-700); background: rgba(0,0,0,0.02); }
        .tab-nav .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); background: #fff; }
        .tab-nav .tab-btn i { font-size: 15px; }
        /* ===== Tab 内容 ===== */
        .tab-content { padding: 20px 24px; flex: 1; overflow-y: auto; }
        .tab-pane { display: none; animation: fadeUp 0.3s ease; }
        .tab-pane.active { display: block; }
        /* ===== 工具栏 ===== */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
        }
        .toolbar .left { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
        .toolbar .right { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
        .toolbar input, .toolbar select {
            padding: 8px 12px;
            border: 1.5px solid var(--gray-200);
            border-radius: var(--radius-sm);
            font-size: 14px;
            background: #fff;
            outline: none;
            transition: var(--transition);
        }
        .toolbar input:focus, .toolbar select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,0.1); }
        .toolbar .search-box {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #fff;
            border: 1.5px solid var(--gray-200);
            border-radius: var(--radius-sm);
            padding: 0 12px;
            transition: var(--transition);
        }
        .toolbar .search-box:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,0.1); }
        .toolbar .search-box i { color: var(--gray-400); }
        .toolbar .search-box input { border: none; padding: 8px 0; font-size: 14px; background: transparent; width: 160px; }
        .toolbar .search-box input:focus { box-shadow: none; }
        /* ===== 表格 ===== */
        .table-wrap { overflow-x: auto; border-radius: var(--radius-sm); border: 1px solid var(--gray-200); background: #fff; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 600px; }
        table th {
            background: var(--gray-50);
            text-align: left;
            padding: 12px 14px;
            font-weight: 600;
            color: var(--gray-600);
            border-bottom: 1px solid var(--gray-200);
            white-space: nowrap;
        }
        table td { padding: 12px 14px; border-bottom: 1px solid var(--gray-100); vertical-align: middle; }
        table tr:hover td { background: var(--gray-50); }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 12px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 500;
        }
        .status-badge.paid { background: var(--success-bg); color: #065F46; }
        .status-badge.pending { background: var(--warning-bg); color: #92400E; }
        .status-badge .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
        .status-badge.paid .dot { background: var(--success); }
        .status-badge.pending .dot { background: var(--warning); }
        .actions-cell { display: flex; flex-wrap: wrap; gap: 4px; }
        .actions-cell .btn { padding: 4px 10px; font-size: 12px; border-radius: 6px; }
        /* ===== 模态框 ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 999;
            animation: fadeIn 0.25s ease;
        }
        .modal-overlay.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal-box {
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 540px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 28px 32px;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .modal-box .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .modal-box .modal-header h3 { font-size: 20px; font-weight: 700; color: var(--gray-900); }
        .modal-box .modal-header .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            color: var(--gray-400);
            cursor: pointer;
            transition: var(--transition);
            padding: 4px;
            line-height: 1;
        }
        .modal-box .modal-header .close-btn:hover { color: var(--gray-600); transform: rotate(90deg); }
        .modal-box .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .modal-box .form-row .full-width { grid-column: 1 / -1; }
        .modal-box .form-group { margin-bottom: 14px; }
        .modal-box .form-group label { font-size: 13px; font-weight: 500; color: var(--gray-700); margin-bottom: 4px; display: block; }
        .modal-box .form-group input, .modal-box .form-group select, .modal-box .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid var(--gray-200);
            border-radius: var(--radius-sm);
            font-size: 14px;
            background: #fff;
            outline: none;
            transition: var(--transition);
        }
        .modal-box .form-group input:focus, .modal-box .form-group select:focus, .modal-box .form-group textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
        }
        .modal-box .form-group textarea { resize: vertical; min-height: 56px; }
        .modal-box .form-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--gray-200);
        }
        .modal-box .form-actions .btn { min-width: 80px; }
        .empty-state { text-align: center; padding: 48px 20px; color: var(--gray-400); }
        .empty-state i { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
        .empty-state p { font-size: 16px; }
        /* ===== 查询 ===== */
        .query-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: end;
            margin-bottom: 16px;
            background: var(--gray-50);
            padding: 16px 18px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--gray-200);
        }
        .query-filters .form-group { margin-bottom: 0; flex: 1 1 150px; min-width: 120px; }
        .query-filters .form-group label { font-size: 12px; font-weight: 500; color: var(--gray-500); margin-bottom: 2px; }
        .query-filters .form-group input, .query-filters .form-group select { padding: 8px 10px; font-size: 13px; }
        .query-result { margin-top: 12px; }
        /* ===== 收银汇总卡片 ===== */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 16px;
        }
        .summary-item {
            background: var(--gray-50);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            border: 1px solid var(--gray-200);
            text-align: center;
        }
        .summary-item .label { font-size: 12px; color: var(--gray-500); }
        .summary-item .value { font-size: 20px; font-weight: 700; color: var(--gray-900); }
        .summary-total {
            background: var(--primary-bg);
            border-color: #C7D2FE;
        }
        .summary-total .value { color: var(--primary); font-size: 22px; }
        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            body { padding: 8px; }
            .login-container { padding: 28px 20px; }
            .app-header { padding: 10px 16px; }
            .app-header .brand { font-size: 16px; }
            .app-header .brand span { display: none; }
            .stats-grid { grid-template-columns: repeat(2,1fr); padding: 12px 16px 0 16px; gap: 8px; }
            .stat-card .stat-value { font-size: 20px; }
            .tab-nav { padding: 8px 12px 0 12px; gap: 2px; overflow-x: auto; flex-wrap: nowrap; }
            .tab-nav .tab-btn { padding: 8px 14px; font-size: 13px; white-space: nowrap; }
            .tab-nav .tab-btn span { display: none; }
            .tab-nav .tab-btn i { font-size: 16px; }
            .tab-content { padding: 12px 12px; }
            .toolbar { flex-direction: column; align-items: stretch; }
            .toolbar .left, .toolbar .right { flex-wrap: wrap; }
            .toolbar .search-box input { width: 120px; }
            .modal-box { padding: 20px 16px; margin: 8px; }
            .modal-box .form-row { grid-template-columns: 1fr; }
            table { font-size: 13px; min-width: 480px; }
            table th, table td { padding: 8px 10px; }
            .query-filters { flex-direction: column; align-items: stretch; }
            .query-filters .form-group { flex: 1 1 auto; min-width: auto; }
            .actions-cell .btn { padding: 3px 8px; font-size: 11px; }
            .summary-grid { grid-template-columns: repeat(2,1fr); }
        }
        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr 1fr; gap: 6px; }
            .stat-card { padding: 12px 14px; }
            .stat-card .stat-value { font-size: 18px; }
            .stat-card .stat-label { font-size: 11px; }
            .app-header .header-actions .user-badge span { display: none; }
            .modal-box .form-actions { flex-direction: column; }
            .modal-box .form-actions .btn { width: 100%; }
            .summary-grid { grid-template-columns: 1fr 1fr; }
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--gray-100); }
        ::-webkit-scrollbar-thumb { background: var(--gray-300); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--gray-400); }
        .text-muted { color: var(--gray-500); }
        .text-sm { font-size: 13px; }
        .fw-600 { font-weight: 600; }
        .flex { display: flex; }
        .flex-center { display: flex; align-items: center; gap: 6px; }
        .mt-8 { margin-top: 8px; }
        .mb-8 { margin-bottom: 8px; }
    </style>
</head>
<body>

    <!-- ===== 登录页面 ===== -->
    <div id="loginPage" class="login-container">
        <div class="login-header">
            <div class="logo-icon"><i class="fas fa-coins"></i></div>
            <h1>出纳管理系统</h1>
            <p>供应商 · 账户 · 收银对账</p>
        </div>
        <div id="loginError" class="login-error"><i class="fas fa-exclamation-circle"></i> 用户名或密码错误</div>
        <form id="loginForm" autocomplete="off">
            <div class="form-group">
                <label>用户名</label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" id="loginUser" placeholder="请输入用户名" required />
                </div>
            </div>
            <div class="form-group">
                <label>密码</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="loginPass" placeholder="请输入密码" required />
                </div>
            </div>
            <button type="submit" class="btn btn-primary"><i class="fas fa-sign-in-alt"></i> 登 录</button>
        </form>
    </div>

    <!-- ===== 主应用 ===== -->
    <div id="appContainer" class="app-container">
        <header class="app-header">
            <div class="brand"><i class="fas fa-coins"></i><span>出纳管理系统</span></div>
            <div class="header-actions">
                <div class="user-badge"><i class="fas fa-user-circle"></i><span id="currentUser">管理员</span></div>
                <button class="btn-logout" id="logoutBtn" title="退出登录"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </header>

        <div class="stats-grid" id="statsGrid">
            <div class="stat-card"><div class="stat-label"><i class="fas fa-users" style="color:var(--primary)"></i> 供应商</div><div class="stat-value" id="statSuppliers">0</div></div>
            <div class="stat-card"><div class="stat-label"><i class="fas fa-university" style="color:#7C3AED"></i> 账户</div><div class="stat-value" id="statAccounts">0</div></div>
            <div class="stat-card"><div class="stat-label"><i class="fas fa-file-invoice" style="color:var(--warning)"></i> 待打款</div><div class="stat-value" id="statPending">0</div></div>
            <div class="stat-card"><div class="stat-label"><i class="fas fa-check-circle" style="color:var(--success)"></i> 已打款</div><div class="stat-value" id="statPaid">0</div></div>
        </div>

        <nav class="tab-nav" id="tabNav">
            <button class="tab-btn active" data-tab="dashboard"><i class="fas fa-chart-pie"></i> <span>概览</span></button>
            <button class="tab-btn" data-tab="suppliers"><i class="fas fa-truck"></i> <span>供应商</span></button>
            <button class="tab-btn" data-tab="accounts"><i class="fas fa-wallet"></i> <span>账户</span></button>
            <button class="tab-btn" data-tab="transactions"><i class="fas fa-exchange-alt"></i> <span>交易</span></button>
            <button class="tab-btn" data-tab="query"><i class="fas fa-search-dollar"></i> <span>查询</span></button>
            <button class="tab-btn" data-tab="cashier"><i class="fas fa-cash-register"></i> <span>收银对账</span></button>
        </nav>

        <div class="tab-content">
            <!-- ===== 概览 ===== -->
            <div class="tab-pane active" id="tab-dashboard">
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;">
                    <div style="background:var(--primary-bg);border-radius:var(--radius-sm);padding:16px;border:1px solid #C7D2FE;">
                        <div style="font-size:13px;color:var(--gray-500);">本月总付款</div>
                        <div style="font-size:28px;font-weight:700;color:var(--gray-900);" id="dashMonthTotal">¥0.00</div>
                    </div>
                    <div style="background:var(--gray-50);border-radius:var(--radius-sm);padding:16px;border:1px solid var(--gray-200);">
                        <div style="font-size:13px;color:var(--gray-500);">本年总付款</div>
                        <div style="font-size:28px;font-weight:700;color:var(--gray-900);" id="dashYearTotal">¥0.00</div>
                    </div>
                </div>
                <div style="background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-sm);padding:16px;">
                    <div style="font-weight:600;margin-bottom:10px;">📋 最近交易</div>
                    <div id="dashRecentTransactions" style="font-size:14px;color:var(--gray-500);">暂无交易记录</div>
                </div>
            </div>

            <!-- ===== 供应商 ===== -->
            <div class="tab-pane" id="tab-suppliers">
                <div class="toolbar">
                    <div class="left"><button class="btn btn-primary btn-sm" onclick="openModal('supplierModal', null)"><i class="fas fa-plus"></i> 新增</button></div>
                    <div class="right">
                        <div class="search-box"><i class="fas fa-search"></i><input type="text" id="supplierSearch" placeholder="搜索供应商..." oninput="renderSuppliers()" /></div>
                    </div>
                </div>
                <div class="table-wrap">
                    <table><thead><tr><th>名称</th><th>供应产品</th><th>联系人</th><th>电话</th><th style="width:140px;">操作</th></tr></thead><tbody id="supplierTableBody"></tbody></table>
                </div>
            </div>

            <!-- ===== 账户 ===== -->
            <div class="tab-pane" id="tab-accounts">
                <div class="toolbar">
                    <div class="left"><button class="btn btn-primary btn-sm" onclick="openModal('accountModal', null)"><i class="fas fa-plus"></i> 新增</button></div>
                    <div class="right">
                        <div class="search-box"><i class="fas fa-search"></i><input type="text" id="accountSearch" placeholder="搜索账户..." oninput="renderAccounts()" /></div>
                    </div>
                </div>
                <div class="table-wrap">
                    <table><thead><tr><th>名称</th><th>类型</th><th>账号</th><th>开户行</th><th style="width:140px;">操作</th></tr></thead><tbody id="accountTableBody"></tbody></table>
                </div>

            <!-- ===== 交易 ===== -->
            <div class="tab-pane" id="tab-transactions">
                <div class="toolbar">
                    <div class="left"><button class="btn btn-primary btn-sm" onclick="openModal('transactionModal', null)"><i class="fas fa-plus"></i> 新增</button></div>
                    <div class="right">
                        <select id="transFilterSupplier" onchange="renderTransactions()"><option value="">全部供应商</option></select>
                        <select id="transFilterStatus" onchange="renderTransactions()"><option value="">全部状态</option><option value="pending">待打款</option><option value="paid">已打款</option></select>
                    </div>
                </div>
                <div class="table-wrap">
                    <table><thead><tr><th>供应商</th><th>账户</th><th>类型</th><th>入库金额</th><th>实付金额</th><th>状态</th><th>日期</th><th style="width:160px;">操作</th></tr></thead><tbody id="transactionTableBody"></tbody></table>
                </div>
            </div>

            <!-- ===== 查询 ===== -->
            <div class="tab-pane" id="tab-query">
                <div class="query-filters">
                    <div class="form-group"><label>供应商</label><select id="querySupplier"><option value="">全部</option></select></div>
                    <div class="form-group"><label>时间维度</label><select id="queryDimension" onchange="toggleQueryDate()"><option value="day">日</option><option value="month">月</option><option value="year">年</option></select></div>
                    <div class="form-group"><label>日期</label><input type="date" id="queryDate" /></div>
                    <div class="form-group" style="flex:0 0 auto;"><button class="btn btn-primary btn-sm" onclick="executeQuery()"><i class="fas fa-search"></i> 查询</button></div>
                </div>
                <div id="queryResult" class="query-result"><div class="empty-state"><i class="fas fa-search-dollar"></i><p>请选择条件后点击查询</p></div></div>
            </div>

            <!-- ===== 收银对账 ===== -->
            <div class="tab-pane" id="tab-cashier">
                <div class="toolbar">
                    <div class="left">
                        <button class="btn btn-primary btn-sm" onclick="openCashierModal()"><i class="fas fa-plus"></i> 录入</button>
                    </div>
                    <div class="right">
                        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
                            <label style="font-size:13px;color:var(--gray-500);">从</label>
                            <input type="date" id="cashierStartDate" style="padding:6px 10px;border:1.5px solid var(--gray-200);border-radius:var(--radius-sm);font-size:13px;" />
                            <label style="font-size:13px;color:var(--gray-500);">至</label>
                            <input type="date" id="cashierEndDate" style="padding:6px 10px;border:1.5px solid var(--gray-200);border-radius:var(--radius-sm);font-size:13px;" />
                            <button class="btn btn-primary btn-sm" onclick="loadCashierRecords()"><i class="fas fa-search"></i> 查询</button>
                            <button class="btn btn-outline btn-sm" onclick="resetCashierQuery()"><i class="fas fa-undo"></i> 重置</button>
                        </div>
                    </div>
                </div>

                <div id="cashierSummary" class="summary-grid"></div>

                <div class="table-wrap">
                    <table>
                        <thead><tr><th>日期</th><th>支付方式</th><th>金额 (¥)</th><th>备注</th><th style="width:80px;">操作</th></tr></thead>
                        <tbody id="cashierTableBody"></tbody>
                    </table>
                </div>
            </div>

        </div><!-- /tab-content -->
    </div><!-- /app-container -->

    <!-- ===== 模态框：供应商 ===== -->
    <div class="modal-overlay" id="supplierModal">
        <div class="modal-box">
            <div class="modal-header"><h3 id="supplierModalTitle">新增供应商</h3><button class="close-btn" onclick="closeModal('supplierModal')">&times;</button></div>
            <form id="supplierForm">
                <input type="hidden" id="supplierFormId" />
                <div class="form-group"><label>名称 *</label><input type="text" id="supplierFormName" required /></div>
                <div class="form-group"><label>供应产品</label><input type="text" id="supplierFormProducts" placeholder="如：钢材、水泥" /></div>
                <div class="form-row">
                    <div class="form-group"><label>联系人</label><input type="text" id="supplierFormContact" /></div>
                    <div class="form-group"><label>电话</label><input type="text" id="supplierFormPhone" /></div>
                </div>
                <div class="form-actions"><button type="button" class="btn btn-outline" onclick="closeModal('supplierModal')">取消</button><button type="submit" class="btn btn-primary">保存</button></div>
            </form>
        </div>
    </div>

    <!-- ===== 模态框：账户 ===== -->
    <div class="modal-overlay" id="accountModal">
        <div class="modal-box">
            <div class="modal-header"><h3 id="accountModalTitle">新增账户</h3><button class="close-btn" onclick="closeModal('accountModal')">&times;</button></div>
            <form id="accountForm">
                <input type="hidden" id="accountFormId" />
                <div class="form-group"><label>账户名称 *</label><input type="text" id="accountFormName" required /></div>
                <div class="form-row">
                    <div class="form-group"><label>类型</label><select id="accountFormType"><option value="public">对公账户</option><option value="private">私用账户</option></select></div>
                    <div class="form-group"><label>账号</label><input type="text" id="accountFormNumber" /></div>
                </div>
                <div class="form-group"><label>开户行</label><input type="text" id="accountFormBank" /></div>
                <div class="form-group"><label>备注</label><input type="text" id="accountFormNote" /></div>
                <div class="form-actions"><button type="button" class="btn btn-outline" onclick="closeModal('accountModal')">取消</button><button type="submit" class="btn btn-primary">保存</button></div>
            </form>
        </div>
    </div>

    <!-- ===== 模态框：交易 ===== -->
    <div class="modal-overlay" id="transactionModal">
        <div class="modal-box">
            <div class="modal-header"><h3 id="transactionModalTitle">新增交易</h3><button class="close-btn" onclick="closeModal('transactionModal')">&times;</button></div>
            <form id="transactionForm">
                <input type="hidden" id="transactionFormId" />
                <div class="form-row">
                    <div class="form-group"><label>供应商 *</label><select id="transactionFormSupplier" required></select></div>
                    <div class="form-group"><label>账户</label><select id="transactionFormAccount"></select></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>类型</label><select id="transactionFormType"><option value="prepay">预付款</option><option value="postpay">后付款</option></select></div>
                    <div class="form-group"><label>交易日期</label><input type="date" id="transactionFormDate" /></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>入库金额 (¥)</label><input type="number" step="0.01" id="transactionFormAmount" placeholder="0.00" /></div>
                    <div class="form-group"><label>实付金额 (¥)</label><input type="number" step="0.01" id="transactionFormPaid" placeholder="0.00" /></div>
                </div>
                <div class="form-group"><label>备注</label><input type="text" id="transactionFormNote" /></div>
                <div class="form-actions"><button type="button" class="btn btn-outline" onclick="closeModal('transactionModal')">取消</button><button type="submit" class="btn btn-primary">保存</button></div>
            </form>
        </div>
    </div>

    <!-- ===== 模态框：确认打款 ===== -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal-box" style="max-width:400px;">
            <div class="modal-header"><h3>确认打款</h3><button class="close-btn" onclick="closeModal('confirmModal')">&times;</button></div>
            <p style="margin-bottom:16px;color:var(--gray-600);">确定已向 <strong id="confirmSupplierName"></strong> 打款 <strong id="confirmAmount"></strong> 元吗？</p>
            <div class="form-actions" style="border-top:none;padding-top:0;">
                <button type="button" class="btn btn-outline" onclick="closeModal('confirmModal')">取消</button>
                <button type="button" class="btn btn-success" id="confirmPayBtn"><i class="fas fa-check"></i> 确认打款</button>
            </div>
        </div>

    <!-- ===== 模态框：收银录入 ===== -->
    <div class="modal-overlay" id="cashierModal">
        <div class="modal-box">
            <div class="modal-header"><h3 id="cashierModalTitle">录入收银记录</h3><button class="close-btn" onclick="closeModal('cashierModal')">&times;</button></div>
            <form id="cashierForm">
                <input type="hidden" id="cashierFormId" />
                <div class="form-row">
                    <div class="form-group"><label>日期 *</label><input type="date" id="cashierFormDate" required /></div>
                    <div class="form-group"><label>支付方式 *</label>
                        <select id="cashierFormMethod" required>
                            <option value="cash">现金</option>
                            <option value="alipay">支付宝</option>
                            <option value="wechat">微信</option>
                            <option value="stored_value">储值卡</option>
                            <option value="other">其他</option>
                        </select>
                    </div>
                </div>
                <div class="form-group"><label>金额 (¥) *</label><input type="number" step="0.01" id="cashierFormAmount" placeholder="0.00" required /></div>
                <div class="form-group"><label>备注</label><input type="text" id="cashierFormNote" placeholder="可选" /></div>
                <div class="form-actions">
                    <button type="button" class="btn btn-outline" onclick="closeModal('cashierModal')">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ================================================================
        // 配置 - 部署时必须修改为您的 Worker 域名
        // ================================================================
        const API_BASE = 'https://cashier-manager.your-username.workers.dev';  // ⚠️ 替换为您的真实 Worker 地址

        // ================================================================
        // 全局状态
        // ================================================================
        let authToken = localStorage.getItem('authToken') || '';
        let currentUser = localStorage.getItem('currentUser') || '管理员';
        let suppliers = [];
        let accounts = [];
        let transactions = [];
        let cashierRecords = [];
        let confirmTargetId = null;

        // ================================================================
        // DOM 引用
        // ================================================================
        const $ = id => document.getElementById(id);
        const loginPage = $('loginPage');
        const appContainer = $('appContainer');
        const loginForm = $('loginForm');
        const loginError = $('loginError');
        const loginUser = $('loginUser');
        const loginPass = $('loginPass');
        const logoutBtn = $('logoutBtn');
        const currentUserSpan = $('currentUser');

        // ================================================================
        // API 工具
        // ================================================================
        async function apiFetch(endpoint, options = {}) {
            const url = API_BASE + endpoint;
            const headers = {
                'Content-Type': 'application/json',
                ...options.headers,
            };
            const token = localStorage.getItem('authToken');
            if (token) {
                headers['Authorization'] = 'Bearer ' + token;
            }
            const resp = await fetch(url, { ...options, headers });
            if (resp.status === 401) {
                logout();
                throw new Error('登录已过期，请重新登录');
            }
            const data = await resp.json();
            if (!resp.ok) {
                throw new Error(data.error || '请求失败');
            }
            return data;
        }

        // ================================================================
        // 认证
        // ================================================================
        async function login(username, password) {
            try {
                const data = await apiFetch('/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ username, password }),
                });
                authToken = data.token;
                currentUser = username;
                localStorage.setItem('authToken', authToken);
                localStorage.setItem('currentUser', currentUser);
                return true;
            } catch (e) {
                console.error(e);
                return false;
            }
        }

        function logout() {
            authToken = '';
            localStorage.removeItem('authToken');
            localStorage.removeItem('currentUser');
            appContainer.classList.remove('active');
            loginPage.style.display = 'block';
            document.body.style.background = '';
        }

        function checkAuth() {
            if (authToken) {
                appContainer.classList.add('active');
                loginPage.style.display = 'none';
                currentUserSpan.textContent = currentUser;
                loadAllData();
                return true;
            }
            return false;
        }

        // ================================================================
        // 登录处理
        // ================================================================
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginError.classList.remove('show');
            const user = loginUser.value.trim();
            const pass = loginPass.value.trim();
            if (!user || !pass) return;
            const ok = await login(user, pass);
            if (ok) {
                loginPage.style.display = 'none';
                appContainer.classList.add('active');
                currentUserSpan.textContent = currentUser;
                loadAllData();
                loginForm.reset();
            } else {
                loginError.classList.add('show');
                loginPass.value = '';
                loginPass.focus();
            }
        });

        logoutBtn.addEventListener('click', logout);
        loginPass.addEventListener('keydown', (e) => { if (e.key === 'Enter') loginForm.dispatchEvent(new Event('submit')); });

        // ================================================================
        // 数据加载
        // ================================================================
        async function loadAllData() {
            try {
                const [sRes, aRes, tRes] = await Promise.all([
                    apiFetch('/suppliers'),
                    apiFetch('/accounts'),
                    apiFetch('/transactions'),
                ]);
                suppliers = sRes.data || [];
                accounts = aRes.data || [];
                transactions = tRes.data || [];
                renderAll();
            } catch (e) {
                console.error('加载数据失败', e);
                if (e.message.includes('登录已过期')) logout();
            }
            // 加载收银记录（单独加载，不影响主数据）
            loadCashierRecords();
        }

        function renderAll() {
            renderStats();
            renderSuppliers();
            renderAccounts();
            renderTransactions();
            renderQueryOptions();
            renderDashboard();
        }

        // ================================================================
        // 统计
        // ================================================================
        function renderStats() {
            $('statSuppliers').textContent = suppliers.length;
            $('statAccounts').textContent = accounts.length;
            const pending = transactions.filter(t => t.status === 'pending').length;
            const paid = transactions.filter(t => t.status === 'paid').length;
            $('statPending').textContent = pending;
            $('statPaid').textContent = paid;
        }

        // ================================================================
        // 仪表盘
        // ================================================================
        function renderDashboard() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const monthTotal = transactions
                .filter(t => t.status === 'paid' && t.transaction_date && t.transaction_date.startsWith(`${year}-${month}`))
                .reduce((s, t) => s + (parseFloat(t.paid_amount) || 0), 0);
            const yearTotal = transactions
                .filter(t => t.status === 'paid' && t.transaction_date && t.transaction_date.startsWith(`${year}`))
                .reduce((s, t) => s + (parseFloat(t.paid_amount) || 0), 0);
            $('dashMonthTotal').textContent = '¥' + monthTotal.toFixed(2);
            $('dashYearTotal').textContent = '¥' + yearTotal.toFixed(2);

            const recent = transactions.slice(-8).reverse();
            const container = $('dashRecentTransactions');
            if (recent.length === 0) {
                container.innerHTML = '暂无交易记录';
            } else {
                container.innerHTML = recent.map(t => {
                    const s = suppliers.find(x => x.id === t.supplier_id);
                    const sName = s ? s.name : '已删除';
                    const statusCls = t.status === 'paid' ? 'paid' : 'pending';
                    const statusLabel = t.status === 'paid' ? '已打款' : '待打款';
                    return `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--gray-100);">
                        <span><strong>${sName}</strong> <span class="status-badge ${statusCls}" style="font-size:11px;padding:1px 10px;"><span class="dot"></span>${statusLabel}</span></span>
                        <span>¥${(parseFloat(t.paid_amount)||0).toFixed(2)} <span class="text-muted text-sm">${t.transaction_date || ''}</span></span>
                    </div>`;
                }).join('');
            }
        }

        // ================================================================
        // 供应商 CRUD
        // ================================================================
        function renderSuppliers() {
            const search = ($('supplierSearch').value || '').toLowerCase();
            const filtered = suppliers.filter(s => s.name.toLowerCase().includes(search) || (s.products || '').toLowerCase().includes(search));
            const tbody = $('supplierTableBody');
            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5"><div class="empty-state" style="padding:24px;"><i class="fas fa-truck"></i><p>暂无供应商</p></div></td></tr>`;
                return;
            }
            tbody.innerHTML = filtered.map(s => `
                <tr>
                    <td><strong>${escHtml(s.name)}</strong></td>
                    <td>${escHtml(s.products || '-')}</td>
                    <td>${escHtml(s.contact || '-')}</td>
                    <td>${escHtml(s.phone || '-')}</td>
                    <td>
                        <div class="actions-cell">
                            <button class="btn btn-primary btn-xs" onclick="editSupplier(${s.id})"><i class="fas fa-edit"></i></button>
                            <button class="btn btn-danger btn-xs" onclick="deleteSupplier(${s.id})"><i class="fas fa-trash"></i></button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        async function saveSupplier(data) {
            const isEdit = !!data.id;
            const endpoint = isEdit ? `/suppliers/${data.id}` : '/suppliers';
            const method = isEdit ? 'PUT' : 'POST';
            return await apiFetch(endpoint, { method, body: JSON.stringify(data) });
        }

        async function deleteSupplier(id) {
            if (!confirm('确定删除该供应商吗？')) return;
            await apiFetch(`/suppliers/${id}`, { method: 'DELETE' });
            await loadAllData();
        }

        function editSupplier(id) {
            const s = suppliers.find(x => x.id === id);
            if (!s) return;
            $('supplierFormId').value = s.id;
            $('supplierFormName').value = s.name || '';
            $('supplierFormProducts').value = s.products || '';
            $('supplierFormContact').value = s.contact || '';
            $('supplierFormPhone').value = s.phone || '';
            $('supplierModalTitle').textContent = '编辑供应商';
            openModal('supplierModal');
        }

        $('supplierForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = parseInt($('supplierFormId').value) || null;
            const data = {
                id,
                name: $('supplierFormName').value.trim(),
                products: $('supplierFormProducts').value.trim(),
                contact: $('supplierFormContact').value.trim(),
                phone: $('supplierFormPhone').value.trim(),
            };
            if (!data.name) return alert('请输入名称');
            await saveSupplier(data);
            closeModal('supplierModal');
            $('supplierForm').reset();
            $('supplierFormId').value = '';
            $('supplierModalTitle').textContent = '新增供应商';
            await loadAllData();
        });

        // ================================================================
        // 账户 CRUD
        // ================================================================
        function renderAccounts() {
            const search = ($('accountSearch').value || '').toLowerCase();
            const filtered = accounts.filter(a => a.name.toLowerCase().includes(search) || (a.account_number || '').includes(search));
            const tbody = $('accountTableBody');
            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5"><div class="empty-state" style="padding:24px;"><i class="fas fa-wallet"></i><p>暂无账户</p></div></td></tr>`;
                return;
            }
            const typeMap = { public: '🏢 对公', private: '👤 私用' };
            tbody.innerHTML = filtered.map(a => `
                <tr>
                    <td><strong>${escHtml(a.name)}</strong></td>
                    <td>${typeMap[a.type] || a.type || '-'}</td>
                    <td>${escHtml(a.account_number || '-')}</td>
                    <td>${escHtml(a.bank || '-')}</td>
                    <td>
                        <div class="actions-cell">
                            <button class="btn btn-primary btn-xs" onclick="editAccount(${a.id})"><i class="fas fa-edit"></i></button>
                            <button class="btn btn-danger btn-xs" onclick="deleteAccount(${a.id})"><i class="fas fa-trash"></i></button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        async function saveAccount(data) {
            const isEdit = !!data.id;
            const endpoint = isEdit ? `/accounts/${data.id}` : '/accounts';
            const method = isEdit ? 'PUT' : 'POST';
            return await apiFetch(endpoint, { method, body: JSON.stringify(data) });
        }

        async function deleteAccount(id) {
            if (!confirm('确定删除该账户吗？')) return;
            await apiFetch(`/accounts/${id}`, { method: 'DELETE' });
            await loadAllData();
        }

        function editAccount(id) {
            const a = accounts.find(x => x.id === id);
            if (!a) return;
            $('accountFormId').value = a.id;
            $('accountFormName').value = a.name || '';
            $('accountFormType').value = a.type || 'public';
            $('accountFormNumber').value = a.account_number || '';
            $('accountFormBank').value = a.bank || '';
            $('accountFormNote').value = a.note || '';
            $('accountModalTitle').textContent = '编辑账户';
            openModal('accountModal');
        }

        $('accountForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = parseInt($('accountFormId').value) || null;
            const data = {
                id,
                name: $('accountFormName').value.trim(),
                type: $('accountFormType').value,
                account_number: $('accountFormNumber').value.trim(),
                bank: $('accountFormBank').value.trim(),
                note: $('accountFormNote').value.trim(),
            };
            if (!data.name) return alert('请输入账户名称');
            await saveAccount(data);
            closeModal('accountModal');
            $('accountForm').reset();
            $('accountFormId').value = '';
            $('accountModalTitle').textContent = '新增账户';
            await loadAllData();
        });

        // ================================================================
        // 交易 CRUD
        // ================================================================
        function renderTransactions() {
            const supFilter = parseInt($('transFilterSupplier').value) || null;
            const statusFilter = $('transFilterStatus').value;
            let filtered = [...transactions];
            if (supFilter) filtered = filtered.filter(t => t.supplier_id === supFilter);
            if (statusFilter) filtered = filtered.filter(t => t.status === statusFilter);
            filtered.sort((a, b) => (b.transaction_date || '').localeCompare(a.transaction_date || ''));

            const tbody = $('transactionTableBody');
            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state" style="padding:24px;"><i class="fas fa-exchange-alt"></i><p>暂无交易记录</p></div></td></tr>`;
                return;
            }
            const typeMap = { prepay: '预付款', postpay: '后付款' };
            const statusMap = { pending: '待打款', paid: '已打款' };
            tbody.innerHTML = filtered.map(t => {
                const s = suppliers.find(x => x.id === t.supplier_id);
                const sName = s ? s.name : '已删除';
                const a = accounts.find(x => x.id === t.account_id);
                const aName = a ? a.name : '-';
                const statusCls = t.status === 'paid' ? 'paid' : 'pending';
                return `
                    <tr>
                        <td><strong>${escHtml(sName)}</strong></td>
                        <td>${escHtml(aName)}</td>
                        <td>${typeMap[t.type] || t.type}</td>
                        <td>¥${(parseFloat(t.amount)||0).toFixed(2)}</td>
                        <td>¥${(parseFloat(t.paid_amount)||0).toFixed(2)}</td>
                        <td><span class="status-badge ${statusCls}"><span class="dot"></span>${statusMap[t.status]||t.status}</span></td>
                        <td>${t.transaction_date || '-'}</td>
                        <td>
                            <div class="actions-cell">
                                ${t.status === 'pending' ? `<button class="btn btn-success btn-xs" onclick="confirmPay(${t.id})"><i class="fas fa-check"></i> 打款</button>` : ''}
                                <button class="btn btn-primary btn-xs" onclick="editTransaction(${t.id})"><i class="fas fa-edit"></i></button>
                                <button class="btn btn-danger btn-xs" onclick="deleteTransaction(${t.id})"><i class="fas fa-trash"></i></button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        async function saveTransaction(data) {
            const isEdit = !!data.id;
            const endpoint = isEdit ? `/transactions/${data.id}` : '/transactions';
            const method = isEdit ? 'PUT' : 'POST';
            return await apiFetch(endpoint, { method, body: JSON.stringify(data) });
        }

        async function deleteTransaction(id) {
            if (!confirm('确定删除该交易记录吗？')) return;
            await apiFetch(`/transactions/${id}`, { method: 'DELETE' });
            await loadAllData();
        }

        function editTransaction(id) {
            const t = transactions.find(x => x.id === id);
            if (!t) return;
            $('transactionFormId').value = t.id;
            $('transactionFormSupplier').value = t.supplier_id || '';
            $('transactionFormAccount').value = t.account_id || '';
            $('transactionFormType').value = t.type || 'prepay';
            $('transactionFormDate').value = t.transaction_date || '';
            $('transactionFormAmount').value = t.amount || '';
            $('transactionFormPaid').value = t.paid_amount || '';
            $('transactionFormNote').value = t.note || '';
            $('transactionModalTitle').textContent = '编辑交易';
            openModal('transactionModal');
        }

        function confirmPay(id) {
            const t = transactions.find(x => x.id === id);
            if (!t) return;
            const s = suppliers.find(x => x.id === t.supplier_id);
            confirmTargetId = id;
            $('confirmSupplierName').textContent = s ? s.name : '供应商';
            $('confirmAmount').textContent = (parseFloat(t.paid_amount) || 0).toFixed(2);
            openModal('confirmModal');
        }

        $('confirmPayBtn').addEventListener('click', async () => {
            if (!confirmTargetId) return;
            await apiFetch(`/transactions/${confirmTargetId}/confirm`, { method: 'PUT' });
            closeModal('confirmModal');
            confirmTargetId = null;
            await loadAllData();
        });

        function populateTransactionSelects() {
            const supSelect = $('transactionFormSupplier');
            const accSelect = $('transactionFormAccount');
            supSelect.innerHTML = suppliers.map(s => `<option value="${s.id}">${escHtml(s.name)}</option>`).join('');
            accSelect.innerHTML = `<option value="">无</option>` + accounts.map(a => `<option value="${a.id}">${escHtml(a.name)}</option>`).join('');
        }

        $('transactionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = parseInt($('transactionFormId').value) || null;
            const data = {
                id,
                supplier_id: parseInt($('transactionFormSupplier').value) || null,
                account_id: parseInt($('transactionFormAccount').value) || null,
                type: $('transactionFormType').value,
                transaction_date: $('transactionFormDate').value,
                amount: parseFloat($('transactionFormAmount').value) || 0,
                paid_amount: parseFloat($('transactionFormPaid').value) || 0,
                note: $('transactionFormNote').value.trim(),
                status: id ? (transactions.find(t => t.id === id)?.status || 'pending') : 'pending',
            };
            if (!data.supplier_id) return alert('请选择供应商');
            if (!data.transaction_date) return alert('请选择交易日期');
            await saveTransaction(data);
            closeModal('transactionModal');
            $('transactionForm').reset();
            $('transactionFormId').value = '';
            $('transactionModalTitle').textContent = '新增交易';
            await loadAllData();
        });

        // ================================================================
        // 查询统计
        // ================================================================
        function renderQueryOptions() {
            const sel = $('querySupplier');
            const current = sel.value;
            sel.innerHTML = `<option value="">全部</option>` + suppliers.map(s => `<option value="${s.id}">${escHtml(s.name)}</option>`).join('');
            if (current) sel.value = current;
            const today = new Date().toISOString().slice(0, 10);
            if (!$('queryDate').value) $('queryDate').value = today;
        }

        function toggleQueryDate() {}

        async function executeQuery() {
            const supplierId = parseInt($('querySupplier').value) || null;
            const dimension = $('queryDimension').value;
            const date = $('queryDate').value;
            if (!date) return alert('请选择日期');

            let startDate, endDate;
            if (dimension === 'day') {
                startDate = date;
                endDate = date;
            } else if (dimension === 'month') {
                const parts = date.split('-');
                const year = parts[0], month = parts[1];
                startDate = `${year}-${month}-01`;
                const lastDay = new Date(parseInt(year), parseInt(month), 0).getDate();
                endDate = `${year}-${month}-${String(lastDay).padStart(2,'0')}`;
            } else {
                const year = date.split('-')[0];
                startDate = `${year}-01-01`;
                endDate = `${year}-12-31`;
            }

            let filtered = transactions.filter(t => {
                if (!t.transaction_date) return false;
                return t.transaction_date >= startDate && t.transaction_date <= endDate;
            });
            if (supplierId) filtered = filtered.filter(t => t.supplier_id === supplierId);

            const paidTotal = filtered.filter(t => t.status === 'paid').reduce((s, t) => s + (parseFloat(t.paid_amount) || 0), 0);
            const pendingTotal = filtered.filter(t => t.status === 'pending').reduce((s, t) => s + (parseFloat(t.paid_amount) || 0), 0);
            const allTotal = paidTotal + pendingTotal;

            const container = $('queryResult');
            if (filtered.length === 0) {
                container.innerHTML = `<div class="empty-state"><i class="fas fa-search-dollar"></i><p>该时间段内无交易记录</p></div>`;
                return;
            }

            const groupMap = {};
            filtered.forEach(t => {
                const key = t.supplier_id;
                if (!groupMap[key]) {
                    const s = suppliers.find(x => x.id === key);
                    groupMap[key] = { name: s ? s.name : '已删除', paid: 0, pending: 0, total: 0 };
                }
                const amt = parseFloat(t.paid_amount) || 0;
                groupMap[key].total += amt;
                if (t.status === 'paid') groupMap[key].paid += amt;
                else groupMap[key].pending += amt;
            });

            let html = `
                <div style="background:var(--primary-bg);border-radius:var(--radius-sm);padding:16px;margin-bottom:16px;border:1px solid #C7D2FE;">
                    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;">
                        <div><span class="text-muted text-sm">总付款</span><div style="font-size:22px;font-weight:700;">¥${allTotal.toFixed(2)}</div></div>
                        <div><span class="text-muted text-sm">已打款</span><div style="font-size:22px;font-weight:700;color:var(--success);">¥${paidTotal.toFixed(2)}</div></div>
                        <div><span class="text-muted text-sm">待打款</span><div style="font-size:22px;font-weight:700;color:var(--warning);">¥${pendingTotal.toFixed(2)}</div></div>
                        <div><span class="text-muted text-sm">交易笔数</span><div style="font-size:22px;font-weight:700;">${filtered.length}</div></div>
                    </div>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>供应商</th><th>已打款</th><th>待打款</th><th>合计</th></tr></thead>
                        <tbody>
                            ${Object.values(groupMap).map(g => `
                                <tr>
                                    <td><strong>${escHtml(g.name)}</strong></td>
                                    <td style="color:var(--success);">¥${g.paid.toFixed(2)}</td>
                                    <td style="color:var(--warning);">¥${g.pending.toFixed(2)}</td>
                                    <td><strong>¥${g.total.toFixed(2)}</strong></td>
                                </tr>
                            `).join('')}
                            <tr style="font-weight:700;background:var(--gray-50);">
                                <td>合计</td>
                                <td>¥${paidTotal.toFixed(2)}</td>
                                <td>¥${pendingTotal.toFixed(2)}</td>
                                <td>¥${allTotal.toFixed(2)}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            `;
            container.innerHTML = html;
        }

        // ================================================================
        // 收银记录管理
        // ================================================================
        async function loadCashierRecords() {
            const startDate = $('cashierStartDate').value;
            const endDate = $('cashierEndDate').value;
            let url = '/cashier-records';
            const params = new URLSearchParams();
            if (startDate) params.append('startDate', startDate);
            if (endDate) params.append('endDate', endDate);
            if (params.toString()) url += '?' + params.toString();

            try {
                const resp = await apiFetch(url);
                cashierRecords = resp.data || [];
                renderCashierRecords();
            } catch (e) {
                console.error('加载收银记录失败', e);
                cashierRecords = [];
                renderCashierRecords();
            }
        }

        function renderCashierRecords() {
            const tbody = $('cashierTableBody');
            if (cashierRecords.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5"><div class="empty-state" style="padding:24px;"><i class="fas fa-cash-register"></i><p>暂无收银记录</p></div></td></tr>`;
                $('cashierSummary').innerHTML = '';
                return;
            }

            const methodMap = { cash: '现金', alipay: '支付宝', wechat: '微信', stored_value: '储值卡', other: '其他' };
            tbody.innerHTML = cashierRecords.map(r => `
                <tr>
                    <td>${r.record_date}</td>
                    <td>${methodMap[r.payment_method] || r.payment_method}</td>
                    <td>¥${(parseFloat(r.amount)||0).toFixed(2)}</td>
                    <td>${escHtml(r.note || '')}</td>
                    <td>
                        <button class="btn btn-danger btn-xs" onclick="deleteCashierRecord(${r.id})"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');

            // 汇总统计
            const summary = {};
            cashierRecords.forEach(r => {
                const method = methodMap[r.payment_method] || r.payment_method;
                summary[method] = (summary[method] || 0) + parseFloat(r.amount || 0);
            });
            const total = Object.values(summary).reduce((a,b) => a+b, 0);
            let html = `
                <div class="summary-item summary-total">
                    <div class="label">总计</div>
                    <div class="value">¥${total.toFixed(2)}</div>
                </div>
            `;
            for (const [k, v] of Object.entries(summary)) {
                html += `
                    <div class="summary-item">
                        <div class="label">${k}</div>
                        <div class="value">¥${v.toFixed(2)}</div>
                    </div>
                `;
            }
            $('cashierSummary').innerHTML = html;
        }

        async function deleteCashierRecord(id) {
            if (!confirm('确定删除该收银记录吗？')) return;
            await apiFetch(`/cashier-records/${id}`, { method: 'DELETE' });
            await loadCashierRecords();
        }

        function openCashierModal() {
            $('cashierFormId').value = '';
            $('cashierModalTitle').textContent = '录入收银记录';
            $('cashierFormDate').value = new Date().toISOString().slice(0, 10);
            $('cashierFormMethod').value = 'cash';
            $('cashierFormAmount').value = '';
            $('cashierFormNote').value = '';
            openModal('cashierModal');
        }

        $('cashierForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                record_date: $('cashierFormDate').value,
                payment_method: $('cashierFormMethod').value,
                amount: parseFloat($('cashierFormAmount').value) || 0,
                note: $('cashierFormNote').value.trim(),
            };
            if (!data.record_date) return alert('请选择日期');
            if (!data.payment_method) return alert('请选择支付方式');
            if (data.amount <= 0) return alert('请输入有效金额');
            await apiFetch('/cashier-records', { method: 'POST', body: JSON.stringify(data) });
            closeModal('cashierModal');
            $('cashierForm').reset();
            await loadCashierRecords();
        });

        function resetCashierQuery() {
            $('cashierStartDate').value = '';
            $('cashierEndDate').value = '';
            loadCashierRecords();
        }

        // ================================================================
        // 模态框工具
        // ================================================================
        function openModal(id) {
            const el = $(id);
            if (!el) return;
            el.classList.add('active');
            document.body.style.overflow = 'hidden';
            if (id === 'transactionModal') {
                populateTransactionSelects();
                if (!$('transactionFormDate').value) {
                    $('transactionFormDate').value = new Date().toISOString().slice(0, 10);
                }
                $('transactionModalTitle').textContent = $('transactionFormId').value ? '编辑交易' : '新增交易';
            }
        }

        function closeModal(id) {
            const el = $(id);
            if (!el) return;
            el.classList.remove('active');
            document.body.style.overflow = '';
        }

        document.querySelectorAll('.modal-overlay').forEach(el => {
            el.addEventListener('click', (e) => {
                if (e.target === el) {
                    el.classList.remove('active');
                    document.body.style.overflow = '';
                }
            });
        });

        // ================================================================
        // Tab 切换
        // ================================================================
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const tab = btn.dataset.tab;
                document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
                const pane = $('tab-' + tab);
                if (pane) pane.classList.add('active');
                // 切换到收银对账时自动加载数据
                if (tab === 'cashier') {
                    loadCashierRecords();
                }
            });
        });

        // ================================================================
        // 工具
        // ================================================================
        function escHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ================================================================
        // 初始化
        // ================================================================
        if (!checkAuth()) {
            loginPage.style.display = 'block';
            appContainer.classList.remove('active');
        }

        setInterval(() => {
            if (authToken) loadAllData();
        }, 60000);

        console.log('💼 出纳管理系统已启动');
        console.log('📌 API地址:', API_BASE);
    </script>
</body>
</html>
