<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>云出纳 · 供应商付款管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="css/style.css" rel="stylesheet" />
</head>
<body>
    <!-- 登录界面 -->
    <div id="loginPage" class="login-container d-flex align-items-center justify-content-center min-vh-100">
        <div class="login-card card shadow-lg border-0" style="max-width:420px; width:100%;">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="bi bi-wallet2 display-3 text-primary"></i>
                    <h3 class="fw-bold mt-2">云出纳</h3>
                    <p class="text-muted small">供应商付款管理系统</p>
                </div>
                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label">用户名</label>
                        <input type="text" id="loginUser" class="form-control form-control-lg" placeholder="请输入用户名" required autofocus />
                    </div>
                    <div class="mb-4">
                        <label class="form-label">密码</label>
                        <input type="password" id="loginPass" class="form-control form-control-lg" placeholder="请输入密码" required />
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100" id="loginBtn">
                        <i class="bi bi-box-arrow-in-right me-2"></i>登 录
                    </button>
                    <div id="loginError" class="text-danger mt-3 text-center small" style="display:none;"></div>
                </form>
            </div>
        </div>
    </div>

    <!-- 主应用界面 -->
    <div id="appPage" style="display:none;">
        <!-- 顶部导航 -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm sticky-top">
            <div class="container-fluid px-3">
                <a class="navbar-brand fw-bold" href="#">
                    <i class="bi bi-wallet2 me-2"></i>云出纳
                </a>
                <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navMenu">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link" data-page="dashboard" href="#"><i class="bi bi-speedometer2 me-1"></i>仪表盘</a></li>
                        <li class="nav-item"><a class="nav-link" data-page="suppliers" href="#"><i class="bi bi-people me-1"></i>供应商</a></li>
                        <li class="nav-item"><a class="nav-link" data-page="accounts" href="#"><i class="bi bi-bank me-1"></i>账户</a></li>
                        <li class="nav-item"><a class="nav-link" data-page="payments" href="#"><i class="bi bi-receipt me-1"></i>付款记录</a></li>
                        <li class="nav-item"><a class="nav-link" data-page="statistics" href="#"><i class="bi bi-bar-chart me-1"></i>统计查询</a></li>
                    </ul>
                    <div class="d-flex align-items-center text-white">
                        <span class="me-3 small" id="userDisplay"><i class="bi bi-person-circle me-1"></i>管理员</span>
                        <button class="btn btn-outline-light btn-sm" id="logoutBtn"><i class="bi bi-box-arrow-right"></i> 退出</button>
                    </div>
                </div>
            </div>
        </nav>

        <!-- 内容区 -->
        <div class="container-fluid px-3 px-md-4 py-4" id="mainContent">
            <!-- 由JS动态渲染 -->
        </div>
    </div>

    <!-- 模态框 -->
    <div class="modal fade" id="commonModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">标题</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modalBody"></div>
                <div class="modal-footer" id="modalFooter">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button class="btn btn-primary" id="modalConfirmBtn">确认</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/pages.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
